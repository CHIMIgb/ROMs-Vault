; docker/php-production.ini
; Configuración de PHP para producción (imagen Docker, Apache mod_php).
; Build-time: se copia a /usr/local/etc/php/conf.d/zz-production.ini en el Dockerfile.
; Dev local (php -S) NO lee este archivo: sigue mostrando errores en desarrollo.

display_errors = Off
; E_ALL en logs (no en pantalla): los errores se registran en el log de Apache,
; nunca se exponen al cliente (ítem 2.4 — OWASP A05).
error_reporting = E_ALL
log_errors = On

; Oculta la versión de PHP en las respuestas.
expose_php = Off