<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargas desde Google Drive - ISOs PSP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .auth-section {
            background: #f0f2f5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .auth-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .auth-btn:hover {
            background: #3367d6;
            transform: scale(1.02);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .file-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .file-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            font-size: 32px;
        }

        .file-details {
            display: flex;
            flex-direction: column;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .file-size {
            font-size: 13px;
            color: #888;
        }

        .file-format {
            background: #e2e8f0;
            color: #4a5568;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .badge {
            background: #764ba2;
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 8px;
            text-transform: uppercase;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>📥</span> 
            Descargas ISOs PSP
        </h1>
        <p class="subtitle">Autentícate con Google para descargar los archivos</p>

        <div class="auth-section">
            <button id="authBtn" class="auth-btn" onclick="handleAuth()">
                <span>🔑</span> Iniciar sesión con Google
            </button>
            <div id="userInfo" class="user-info" style="display: none;">
                <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
                <span id="userEmail"></span>
                <button onclick="signOut()" style="background: none; border: none; color: #666; cursor: pointer;">✕</button>
            </div>
        </div>

        <div id="fileList" class="file-list">
            <div class="loading">Esperando autenticación...</div>
        </div>

        <div id="statusMessage" class="status"></div>
        <div id="progressBar" class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <small style="color: #888;">🔒 Descargas directas sin ventanas de Google Drive</small>
        </div>
    </div>

    <script>
        // Configuración de OAuth 2.0
        const CLIENT_ID = '893085215496-b6s7u32ib0lvgg7vd187r8r4m7fk1t5f.apps.googleusercontent.com'; // Reemplaza con tu Client ID
        const API_KEY = 'AIzaSyB8JfIJeS_FuO1FnRZ2HqEynFFrnBBP8-Q'; // Tu API Key
        
        // Archivos a descargar
        const FILES = [
            {
                id: '1fVWgArFcMMUFVX5SXkdMR5pQYU2uyXYj',
                name: 'WipEout Pulse.iso',
                displayName: 'WipEout Pulse',
                size: '432 MB',
                icon: '🏎️',
                game: 'PSP',
                format: 'iso'
            },
            {
                id: '1zRYOBNATxrbsN1WLzLioTRQD_tTx8L-z',
                name: 'WipEout Pure.iso',
                displayName: 'WipEout Pure',
                size: '415 MB',
                icon: '🏁',
                game: 'PSP',
                format: 'iso'
            },
            {
                id: '1Fv6nQ27Ip9sy5prOoc1dQe-hel-7A6hq',
                name: 'Carnivores.iso',
                displayName: 'Carnivores',
                size: '398 MB',
                icon: '🦖',
                game: 'PSP',
                format: 'iso'
            }
        ];

        let accessToken = null;

        // Cargar la API de Google
        function loadGoogleAPI() {
            const script = document.createElement('script');
            script.src = 'https://apis.google.com/js/api.js';
            script.onload = initializeGoogleAPI;
            document.head.appendChild(script);
        }

        // Inicializar API de Google
        function initializeGoogleAPI() {
            gapi.load('client:auth2', initClient);
        }

        // Inicializar cliente OAuth
        function initClient() {
            gapi.client.init({
                apiKey: API_KEY,
                clientId: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.readonly',
                discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']
            }).then(() => {
                // Verificar si ya hay sesión
                const authInstance = gapi.auth2.getAuthInstance();
                if (authInstance.isSignedIn.get()) {
                    accessToken = authInstance.currentUser.get().getAuthResponse().access_token;
                    handleSignInSuccess(authInstance.currentUser.get());
                }
            });
        }

        // Manejar autenticación
        function handleAuth() {
            const authBtn = document.getElementById('authBtn');
            authBtn.disabled = true;
            authBtn.innerHTML = '<span>⏳</span> Autenticando...';

            gapi.auth2.getAuthInstance().signIn().then(
                (user) => {
                    accessToken = user.getAuthResponse().access_token;
                    handleSignInSuccess(user);
                },
                (error) => {
                    console.error('Error de autenticación:', error);
                    showStatus('error', 'Error al autenticar. Intenta de nuevo.');
                    authBtn.disabled = false;
                    authBtn.innerHTML = '<span>🔑</span> Iniciar sesión con Google';
                }
            );
        }

        // Manejar éxito de autenticación
        function handleSignInSuccess(user) {
            const profile = user.getBasicProfile();
            
            document.getElementById('authBtn').style.display = 'none';
            
            const userInfo = document.getElementById('userInfo');
            document.getElementById('userAvatar').src = profile.getImageUrl();
            document.getElementById('userEmail').textContent = profile.getEmail();
            userInfo.style.display = 'flex';
            
            renderFileList();
            showStatus('success', '✅ Autenticación exitosa. Ya puedes descargar.');
        }

        // Cerrar sesión
        function signOut() {
            gapi.auth2.getAuthInstance().signOut().then(() => {
                accessToken = null;
                document.getElementById('authBtn').style.display = 'inline-flex';
                document.getElementById('userInfo').style.display = 'none';
                document.getElementById('fileList').innerHTML = '<div class="loading">Esperando autenticación...</div>';
            });
        }

        // Función mejorada para descargar archivo con OAuth
        async function downloadFile(fileData, buttonElement) {
            if (!accessToken) {
                showStatus('error', '❌ Debes iniciar sesión primero');
                return;
            }

            try {
                // Deshabilitar botón
                if (buttonElement) {
                    buttonElement.disabled = true;
                    buttonElement.innerHTML = '<span>⏳</span> Descargando...';
                }

                // Mostrar progreso
                const progressBar = document.getElementById('progressBar');
                const progressFill = document.getElementById('progressFill');
                progressBar.style.display = 'block';
                progressFill.style.width = '30%';

                showStatus('info', `⏳ Descargando ${fileData.displayName}...`);

                // Hacer petición a Google Drive API con el token OAuth
                progressFill.style.width = '50%';
                
                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files/${fileData.id}?alt=media`,
                    {
                        headers: {
                            'Authorization': `Bearer ${accessToken}`
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error('Error al descargar');
                }

                progressFill.style.width = '70%';

                // Obtener el blob del archivo
                const blob = await response.blob();
                
                progressFill.style.width = '90%';

                // Crear URL temporal y descargar
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileData.name; // Nombre correcto
                
                document.body.appendChild(a);
                a.click();
                
                // Limpiar
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                progressFill.style.width = '100%';
                
                showStatus('success', `✅ ¡Descarga completada! ${fileData.name}`);
                
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                showStatus('error', '❌ Error al descargar. Intenta de nuevo.');
                document.getElementById('progressBar').style.display = 'none';
            } finally {
                // Rehabilitar botón
                if (buttonElement) {
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = '<span>⬇️</span> Descargar';
                }
            }
        }

        // Renderizar lista de archivos
        function renderFileList() {
            const fileListElement = document.getElementById('fileList');
            fileListElement.innerHTML = '';

            FILES.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-info">
                        <span class="file-icon">${file.icon}</span>
                        <div class="file-details">
                            <div class="file-name">
                                ${file.displayName}
                                <span class="badge">${file.game}</span>
                                <span class="file-format">.${file.format}</span>
                            </div>
                            <span class="file-size">${file.size}</span>
                        </div>
                    </div>
                    <button class="download-btn" onclick="downloadFile(${JSON.stringify(file).replace(/"/g, '&quot;')}, this)">
                        <span>⬇️</span> Descargar
                    </button>
                `;
                fileListElement.appendChild(fileItem);
            });
        }

        // Mostrar mensajes de estado
        function showStatus(type, message) {
            const statusElement = document.getElementById('statusMessage');
            statusElement.className = `status ${type}`;
            statusElement.innerHTML = message;
            statusElement.style.display = 'block';
            
            if (type !== 'error') {
                setTimeout(() => {
                    statusElement.style.display = 'none';
                }, 5000);
            }
        }

        // Cargar API al iniciar
        loadGoogleAPI();
    </script>
</body>
</html>
