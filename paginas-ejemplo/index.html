<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargas desde Google Drive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .file-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .file-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            font-size: 24px;
        }

        .file-details {
            display: flex;
            flex-direction: column;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .file-size {
            font-size: 13px;
            color: #888;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .download-btn i {
            font-size: 16px;
        }

        .config-section {
            background: #f0f2f5;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .config-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .config-item {
            margin-bottom: 12px;
        }

        .config-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 5px;
        }

        .config-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .config-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .badge {
            background: #e2e8f0;
            color: #4a5568;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 Descargas desde Google Drive</h1>
        <p class="subtitle">Configura y descarga archivos directamente desde tu Drive</p>

        <div class="config-section">
            <div class="config-title">⚙️ Configuración de API</div>
            <div class="config-item">
                <label class="config-label">AIzaSyB8JfIJeS_FuO1FnRZ2HqEynFFrnBBP8-Q</label>
                <input type="text" id="apiKey" class="config-input" placeholder="AIzaSyB...">
                <small style="color: #888;">Obtén tu API Key en Google Cloud Console</small>
            </div>
        </div>

        <div id="fileList" class="file-list">
            <div class="loading">Cargando archivos...</div>
        </div>

        <div id="statusMessage" class="status"></div>

        <div style="text-align: center; margin-top: 20px;">
            <small style="color: #888;">🔒 Archivos almacenados de forma segura en Google Drive</small>
        </div>
    </div>

    <script>
        // Configuración de archivos
        const FILES = [
            {
                id: '1fVWgArFcMMUFVX5SXkdMR5pQYU2uyXYj', // Reemplaza con tu File ID
                name: 'WipEout pulse.iso',
                size: '400 MB',
                icon: '📄'
            },
            {
                id: '1zRYOBNATxrbsN1WLzLioTRQD_tTx8L-z', // Reemplaza con tu File ID
                name: 'WipEout pure.iso',
                size: '400 MB',
                icon: '🖼️'
            },
                        {
                id: '1Fv6nQ27Ip9sy5prOoc1dQe-hel-7A6hq', // Reemplaza con tu File ID
                name: 'Carnivores.iso',
                size: '400 MB',
                icon: '🖼️'
            }
        ];

        // Función para obtener enlace de descarga directa de Google Drive
        function getDirectDownloadLink(fileId, apiKey) {
            return `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${apiKey}`;
        }

        // Función para verificar si la API key es válida
        async function verifyApiKey(apiKey) {
            try {
                const testFileId = FILES[0].id;
                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files/${testFileId}?fields=id,name&key=${apiKey}`
                );
                
                if (response.ok) {
                    return true;
                } else {
                    const error = await response.json();
                    console.error('Error de API:', error);
                    return false;
                }
            } catch (error) {
                console.error('Error verificando API key:', error);
                return false;
            }
        }

        // Función para mostrar los archivos
        function renderFileList(apiKey) {
            const fileListElement = document.getElementById('fileList');
            const statusElement = document.getElementById('statusMessage');
            
            fileListElement.innerHTML = '<div class="loading">Verificando configuración...</div>';
            
            if (!apiKey) {
                fileListElement.innerHTML = `
                    <div style="text-align: center; padding: 30px; color: #666;">
                        🔑 Ingresa tu API Key de Google para ver los archivos
                    </div>
                `;
                return;
            }

            // Verificar API key antes de mostrar archivos
            verifyApiKey(apiKey).then(isValid => {
                if (isValid) {
                    fileListElement.innerHTML = '';
                    
                    FILES.forEach(file => {
                        const downloadLink = getDirectDownloadLink(file.id, apiKey);
                        
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        fileItem.innerHTML = `
                            <div class="file-info">
                                <span class="file-icon">${file.icon}</span>
                                <div class="file-details">
                                    <span class="file-name">${file.name}</span>
                                    <span class="file-size">${file.size}</span>
                                </div>
                            </div>
                            <a href="${downloadLink}" 
                               class="download-btn" 
                               target="_blank"
                               onclick="trackDownload('${file.name}')">
                                <span>⬇️</span> Descargar
                            </a>
                        `;
                        
                        fileListElement.appendChild(fileItem);
                    });

                    statusElement.className = 'status success';
                    statusElement.innerHTML = '✅ API Key válida. Archivos listos para descargar.';
                } else {
                    fileListElement.innerHTML = `
                        <div style="text-align: center; padding: 30px; color: #666;">
                            ❌ API Key inválida. Verifica tu configuración.
                        </div>
                    `;
                    statusElement.className = 'status error';
                    statusElement.innerHTML = '❌ API Key inválida. Verifica que la API de Drive esté habilitada.';
                }
            });
        }

        // Función para tracking de descargas (opcional)
        function trackDownload(fileName) {
            console.log(`Descargando: ${fileName}`);
            // Aquí puedes agregar analytics o tracking
        }

        // Event listener para cambios en API key
        document.getElementById('apiKey').addEventListener('input', (e) => {
            const apiKey = e.target.value.trim();
            renderFileList(apiKey);
        });

        // Cargar archivos inicialmente si hay API key guardada
        const savedApiKey = localStorage.getItem('driveApiKey') || '';
        if (savedApiKey) {
            document.getElementById('apiKey').value = savedApiKey;
            renderFileList(savedApiKey);
        }

        // Guardar API key localmente (opcional)
        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem('driveApiKey', e.target.value.trim());
        });
    </script>
</body>
</html>
