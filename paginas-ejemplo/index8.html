<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargas desde Google Drive - ISOs PSP</title>
    <style>
        /* (Mantén los mismos estilos que antes) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .auth-section {
            background: #f0f2f5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .auth-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .auth-btn:hover {
            background: #3367d6;
            transform: scale(1.02);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .file-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .file-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            font-size: 32px;
        }

        .file-details {
            display: flex;
            flex-direction: column;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .file-size {
            font-size: 13px;
            color: #888;
        }

        .file-format {
            background: #e2e8f0;
            color: #4a5568;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .badge {
            background: #764ba2;
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 8px;
            text-transform: uppercase;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .config-section {
            background: #f0f2f5;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none; /* Oculto por defecto */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>📥</span> 
            Descargas ISOs PSP
        </h1>
        <p class="subtitle">Autentícate con Google para descargar los archivos</p>

        <div class="auth-section">
            <button id="authBtn" class="auth-btn" onclick="handleAuth()">
                <span>🔑</span> Iniciar sesión con Google
            </button>
            <div id="userInfo" class="user-info" style="display: none;">
                <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
                <span id="userEmail"></span>
                <button onclick="signOut()" style="background: none; border: none; color: #666; cursor: pointer;">✕</button>
            </div>
        </div>

        <div id="fileList" class="file-list">
            <div class="loading">Esperando autenticación...</div>
        </div>

        <div id="statusMessage" class="status"></div>
        <div id="progressBar" class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <small style="color: #888;">🔒 Descargas directas sin ventanas de Google Drive</small>
        </div>
    </div>

    <script>
        // Configuración - REEMPLAZA CON TUS DATOS
        const CLIENT_ID = '893085215496-b6s7u32ib0lvgg7vd187r8r4m7fk1t5f.apps.googleusercontent.com'; // ← REEMPLAZA ESTO
        const API_KEY = 'AIzaSyB8JfIJeS_FuO1FnRZ2HqEynFFrnBBP8-Q';
        
        // Archivos a descargar
        const FILES = [
            {
                id: '1fVWgArFcMMUFVX5SXkdMR5pQYU2uyXYj',
                name: 'WipEout Pulse.iso',
                displayName: 'WipEout Pulse',
                size: '432 MB',
                icon: '🏎️',
                game: 'PSP',
                format: 'iso'
            },
            {
                id: '1zRYOBNATxrbsN1WLzLioTRQD_tTx8L-z',
                name: 'WipEout Pure.iso',
                displayName: 'WipEout Pure',
                size: '415 MB',
                icon: '🏁',
                game: 'PSP',
                format: 'iso'
            },
            {
                id: '1Fv6nQ27Ip9sy5prOoc1dQe-hel-7A6hq',
                name: 'Carnivores.iso',
                displayName: 'Carnivores',
                size: '398 MB',
                icon: '🦖',
                game: 'PSP',
                format: 'iso'
            }
        ];

        let accessToken = null;
        let tokenClient = null;

        // Inicializar Google API
        function initializeGoogleAuth() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.readonly',
                callback: (tokenResponse) => {
                    if (tokenResponse.error) {
                        console.error('Error de token:', tokenResponse);
                        showStatus('error', 'Error de autenticación: ' + tokenResponse.error);
                        return;
                    }
                    
                    accessToken = tokenResponse.access_token;
                    handleSignInSuccess();
                },
                error_callback: (error) => {
                    console.error('Error de OAuth:', error);
                    showStatus('error', 'Error al autenticar. Verifica la configuración de OAuth.');
                    
                    // Mostrar instrucciones
                    const fileList = document.getElementById('fileList');
                    fileList.innerHTML = `
                        <div style="background: #f8d7da; color: #721c24; padding: 20px; border-radius: 8px;">
                            <h3 style="margin-bottom: 10px;">❌ Error de configuración</h3>
                            <p style="margin-bottom: 10px;">Debes configurar correctamente OAuth 2.0:</p>
                            <ol style="margin-left: 20px;">
                                <li>Ve a Google Cloud Console</li>
                                <li>APIs y servicios → Credenciales</li>
                                <li>Edita tu credencial OAuth 2.0</li>
                                <li>Agrega en "Orígenes autorizados":</li>
                                <ul>
                                    <li>http://localhost</li>
                                    <li>http://127.0.0.1</li>
                                </ul>
                                <li>Agrega en "URIs de redireccionamiento":</li>
                                <ul>
                                    <li>http://localhost</li>
                                    <li>http://127.0.0.1</li>
                                </ul>
                            </ol>
                        </div>
                    `;
                }
            });
        }

        // Manejar autenticación
        function handleAuth() {
            const authBtn = document.getElementById('authBtn');
            authBtn.disabled = true;
            authBtn.innerHTML = '<span>⏳</span> Autenticando...';

            if (!tokenClient) {
                initializeGoogleAuth();
            }

            // Solicitar token
            tokenClient.requestAccessToken({
                prompt: 'consent',
                login_hint: undefined // Importante: no usar login_hint
            });
        }

        // Manejar éxito de autenticación
        function handleSignInSuccess() {
            document.getElementById('authBtn').style.display = 'none';
            
            // Obtener información del usuario (opcional)
            fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            })
            .then(response => response.json())
            .then(userInfo => {
                const userInfoDiv = document.getElementById('userInfo');
                document.getElementById('userEmail').textContent = userInfo.email;
                if (userInfo.picture) {
                    document.getElementById('userAvatar').src = userInfo.picture;
                }
                userInfoDiv.style.display = 'flex';
            })
            .catch(() => {
                // Si no se puede obtener la info, mostrar solo el botón de cerrar sesión
                const userInfoDiv = document.getElementById('userInfo');
                document.getElementById('userEmail').textContent = 'Usuario autenticado';
                userInfoDiv.style.display = 'flex';
            });
            
            renderFileList();
            showStatus('success', '✅ Autenticación exitosa. Ya puedes descargar.');
        }

        // Cerrar sesión
        function signOut() {
            accessToken = null;
            if (tokenClient) {
                google.accounts.oauth2.revoke(accessToken, () => {
                    console.log('Sesión cerrada');
                });
            }
            
            document.getElementById('authBtn').style.display = 'inline-flex';
            document.getElementById('authBtn').disabled = false;
            document.getElementById('authBtn').innerHTML = '<span>🔑</span> Iniciar sesión con Google';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('fileList').innerHTML = '<div class="loading">Esperando autenticación...</div>';
        }

        // Función para descargar archivo
        async function downloadFile(fileData, buttonElement) {
            if (!accessToken) {
                showStatus('error', '❌ Debes iniciar sesión primero');
                return;
            }

            try {
                if (buttonElement) {
                    buttonElement.disabled = true;
                    buttonElement.innerHTML = '<span>⏳</span> Descargando...';
                }

                const progressBar = document.getElementById('progressBar');
                const progressFill = document.getElementById('progressFill');
                progressBar.style.display = 'block';
                progressFill.style.width = '30%';

                showStatus('info', `⏳ Descargando ${fileData.displayName}...`);

                progressFill.style.width = '50%';
                
                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files/${fileData.id}?alt=media`,
                    {
                        headers: {
                            'Authorization': `Bearer ${accessToken}`
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error('Error al descargar');
                }

                progressFill.style.width = '70%';

                const blob = await response.blob();
                
                progressFill.style.width = '90%';

                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileData.name;
                
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                progressFill.style.width = '100%';
                
                showStatus('success', `✅ ¡Descarga completada! ${fileData.name}`);
                
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                showStatus('error', '❌ Error al descargar. Intenta de nuevo.');
                document.getElementById('progressBar').style.display = 'none';
            } finally {
                if (buttonElement) {
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = '<span>⬇️</span> Descargar';
                }
            }
        }

        // Renderizar lista de archivos
        function renderFileList() {
            const fileListElement = document.getElementById('fileList');
            fileListElement.innerHTML = '';

            FILES.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-info">
                        <span class="file-icon">${file.icon}</span>
                        <div class="file-details">
                            <div class="file-name">
                                ${file.displayName}
                                <span class="badge">${file.game}</span>
                                <span class="file-format">.${file.format}</span>
                            </div>
                            <span class="file-size">${file.size}</span>
                        </div>
                    </div>
                    <button class="download-btn" onclick="downloadFile(${JSON.stringify(file).replace(/"/g, '&quot;')}, this)">
                        <span>⬇️</span> Descargar
                    </button>
                `;
                fileListElement.appendChild(fileItem);
            });
        }

        // Mostrar mensajes de estado
        function showStatus(type, message) {
            const statusElement = document.getElementById('statusMessage');
            statusElement.className = `status ${type}`;
            statusElement.innerHTML = message;
            statusElement.style.display = 'block';
            
            if (type !== 'error') {
                setTimeout(() => {
                    statusElement.style.display = 'none';
                }, 5000);
            }
        }

        // Cargar la librería de Google
        function loadGoogleLibraries() {
            // Cargar Google Identity Services
            const script1 = document.createElement('script');
            script1.src = 'https://accounts.google.com/gsi/client';
            script1.onload = () => {
                console.log('Google Identity Services cargado');
            };
            document.head.appendChild(script1);

            // Cargar Google API client
            const script2 = document.createElement('script');
            script2.src = 'https://apis.google.com/js/api.js';
            script2.onload = () => {
                console.log('Google API client cargado');
            };
            document.head.appendChild(script2);
        }

        // Iniciar
        loadGoogleLibraries();
    </script>
</body>
</html>
