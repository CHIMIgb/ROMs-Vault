<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargas desde Google Drive - ISOs PSP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .file-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .file-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            font-size: 32px;
        }

        .file-details {
            display: flex;
            flex-direction: column;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .file-size {
            font-size: 13px;
            color: #888;
        }

        .file-format {
            background: #e2e8f0;
            color: #4a5568;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .config-section {
            background: #f0f2f5;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .config-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .config-item {
            margin-bottom: 12px;
        }

        .config-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 5px;
        }

        .config-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .config-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .badge {
            background: #764ba2;
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 8px;
            text-transform: uppercase;
        }

        .warning-box {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>📥</span> 
            Descargas ISOs PSP
        </h1>
        <p class="subtitle">Haz clic en Descargar para obtener los archivos</p>

        <div class="config-section">
            <div class="config-title">⚙️ Configuración</div>
            <div class="config-item">
                <label class="config-label">API Key de Google</label>
                <input type="text" id="apiKey" class="config-input" placeholder="AIzaSyB8JfIJeS_FuO1FnRZ2HqEynFFrnBBP8-Q" value="AIzaSyB8JfIJeS_FuO1FnRZ2HqEynFFrnBBP8-Q">
                <small style="color: #888;">Tu API Key está preconfigurada</small>
            </div>
        </div>

        <div class="warning-box">
            <span>⚠️</span>
            <div>
                <strong>Importante:</strong> Si aparece una página de advertencia, haz clic en <strong>"Descargar de todas formas"</strong>.
            </div>
        </div>

        <div id="fileList" class="file-list">
            <div class="loading">Cargando archivos...</div>
        </div>

        <div id="statusMessage" class="status"></div>

        <div style="text-align: center; margin-top: 20px;">
            <small style="color: #888;">🔒 Archivos almacenados en Google Drive</small>
        </div>
    </div>

    <script>
        // Configuración de archivos
        const FILES = [
            {
                id: '1fVWgArFcMMUFVX5SXkdMR5pQYU2uyXYj',
                name: 'WipEout Pulse.iso',
                displayName: 'WipEout Pulse',
                size: '432 MB',
                icon: '🏎️',
                game: 'PSP',
                format: 'iso'
            },
            {
                id: '1zRYOBNATxrbsN1WLzLioTRQD_tTx8L-z',
                name: 'WipEout Pure.iso',
                displayName: 'WipEout Pure',
                size: '415 MB',
                icon: '🏁',
                game: 'PSP',
                format: 'iso'
            },
            {
                id: '1Fv6nQ27Ip9sy5prOoc1dQe-hel-7A6hq',
                name: 'Carnivores.iso',
                displayName: 'Carnivores',
                size: '398 MB',
                icon: '🦖',
                game: 'PSP',
                format: 'iso'
            }
        ];

        // Función para obtener enlace de descarga directa
        function getDirectDownloadLink(fileId, apiKey) {
            return `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${apiKey}`;
        }

        // Función para verificar API key
        async function verifyApiKey(apiKey) {
            try {
                const testFileId = FILES[0].id;
                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files/${testFileId}?fields=id,name&key=${apiKey}`
                );
                return response.ok;
            } catch (error) {
                return false;
            }
        }

        // Función para iniciar descarga directa (abre el gestor de archivos)
        function startDownload(fileId, apiKey, fileName) {
            // Construir enlace de descarga
            const downloadUrl = getDirectDownloadLink(fileId, apiKey);
            
            // Crear elemento <a> temporal
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = fileName; // Sugerir nombre de archivo
            link.target = '_blank'; // Abrir en nueva pestaña por si acaso
            
            // Simular clic
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Mostrar mensaje
            const statusElement = document.getElementById('statusMessage');
            statusElement.className = 'status success';
            statusElement.innerHTML = `✅ Descarga iniciada: ${fileName}`;
            statusElement.style.display = 'block';
            
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 3000);
        }

        // Función para mostrar archivos
        function renderFileList(apiKey) {
            const fileListElement = document.getElementById('fileList');
            const statusElement = document.getElementById('statusMessage');
            
            fileListElement.innerHTML = '<div class="loading">Verificando configuración...</div>';
            
            if (!apiKey) {
                fileListElement.innerHTML = '<div style="text-align: center; padding: 30px;">🔑 Ingresa tu API Key</div>';
                return;
            }

            verifyApiKey(apiKey).then(isValid => {
                if (isValid) {
                    fileListElement.innerHTML = '';
                    
                    FILES.forEach(file => {
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        fileItem.innerHTML = `
                            <div class="file-info">
                                <span class="file-icon">${file.icon}</span>
                                <div class="file-details">
                                    <div class="file-name">
                                        ${file.displayName}
                                        <span class="badge">${file.game}</span>
                                        <span class="file-format">.${file.format}</span>
                                    </div>
                                    <span class="file-size">${file.size}</span>
                                </div>
                            </div>
                            <button class="download-btn" onclick="startDownload('${file.id}', '${apiKey}', '${file.name}')">
                                <span>⬇️</span> Descargar
                            </button>
                        `;
                        
                        fileListElement.appendChild(fileItem);
                    });

                    statusElement.className = 'status success';
                    statusElement.innerHTML = '✅ Listo para descargar';
                    statusElement.style.display = 'block';
                    
                    setTimeout(() => {
                        statusElement.style.display = 'none';
                    }, 3000);
                } else {
                    fileListElement.innerHTML = '<div style="text-align: center; padding: 30px;">❌ API Key inválida</div>';
                    statusElement.className = 'status error';
                    statusElement.innerHTML = '❌ API Key inválida';
                    statusElement.style.display = 'block';
                }
            });
        }

        // Event listeners
        document.getElementById('apiKey').addEventListener('input', (e) => {
            const apiKey = e.target.value.trim();
            renderFileList(apiKey);
        });

        // Cargar inicial
        const defaultApiKey = 'AIzaSyB8JfIJeS_FuO1FnRZ2HqEynFFrnBBP8-Q';
        const savedApiKey = localStorage.getItem('driveApiKey') || defaultApiKey;
        
        if (savedApiKey) {
            document.getElementById('apiKey').value = savedApiKey;
            renderFileList(savedApiKey);
        }

        // Guardar API key
        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem('driveApiKey', e.target.value.trim());
        });
    </script>
</body>
</html>
