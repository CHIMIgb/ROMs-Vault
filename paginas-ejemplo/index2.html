<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargas de ISOs PSP - Google Drive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .file-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .file-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            font-size: 32px;
        }

        .file-details {
            display: flex;
            flex-direction: column;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .file-size {
            font-size: 13px;
            color: #888;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .game-tag {
            background: #764ba2;
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .warning-box {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .warning-box span {
            font-size: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>📥</span> 
            Descargas PSP ISOs
        </h1>
        <p class="subtitle">Haz clic en Descargar para obtener los archivos desde Google Drive</p>

        <div id="fileList" class="file-list">
            <!-- Los archivos se cargarán aquí con JavaScript -->
        </div>

        <div class="warning-box">
            <span>⚠️</span>
            <div>
                <strong>Importante:</strong> Si aparece una advertencia de Google Drive, haz clic en "Descargar de todas formas" o "Continuar con la descarga".
            </div>
        </div>

        <div class="footer">
            🔒 Archivos almacenados de forma segura en Google Drive
        </div>
    </div>

    <script>
        // Configuración de archivos con enlaces directos de Google Drive
        const FILES = [
            {
                id: '1fVWgArFcMMUFVX5SXkdMR5pQYU2uyXYj',
                name: 'WipEout Pulse.iso',
                size: '432 MB',
                icon: '🏎️',
                game: 'PSP'
            },
            {
                id: '1zRYOBNATxrbsN1WLzLioTRQD_tTx8L-z',
                name: 'WipEout Pure.iso',
                size: '415 MB',
                icon: '🏁',
                game: 'PSP'
            },
            {
                id: '1Fv6nQ27Ip9sy5prOoc1dQe-hel-7A6hq',
                name: 'Carnivores.iso',
                size: '398 MB',
                icon: '🦖',
                game: 'PSP'
            }
        ];

        // Función para generar enlace directo de descarga de Google Drive
        function getDriveDownloadLink(fileId) {
            // Método principal para descarga directa
            return `https://drive.google.com/uc?export=download&id=${fileId}&confirm=t`;
            
            // Métodos alternativos si el principal no funciona:
            // return `https://drive.google.com/uc?id=${fileId}&export=download`;
            // return `https://drive.google.com/uc?export=download&id=${fileId}`;
        }

        // Función para abrir la descarga
        function downloadFile(fileId, fileName) {
            // Abrir el enlace de descarga en una nueva pestaña
            const downloadUrl = getDriveDownloadLink(fileId);
            
            // Crear un elemento <a> temporal
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.target = '_blank'; // Abrir en nueva pestaña
            link.rel = 'noopener noreferrer';
            
            // Simular clic
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Mostrar mensaje en consola
            console.log(`📥 Descargando: ${fileName}`);
        }

        // Función para renderizar la lista de archivos
        function renderFileList() {
            const fileListElement = document.getElementById('fileList');
            
            // Limpiar y mostrar archivos
            fileListElement.innerHTML = '';
            
            FILES.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                
                fileItem.innerHTML = `
                    <div class="file-info">
                        <span class="file-icon">${file.icon}</span>
                        <div class="file-details">
                            <div class="file-name">
                                ${file.name}
                                <span class="game-tag">${file.game}</span>
                            </div>
                            <span class="file-size">${file.size}</span>
                        </div>
                    </div>
                    <button class="download-btn" onclick="downloadFile('${file.id}', '${file.name}')">
                        <span>⬇️</span> Descargar
                    </button>
                `;
                
                fileListElement.appendChild(fileItem);
            });
        }

        // Cargar los archivos cuando la página esté lista
        document.addEventListener('DOMContentLoaded', renderFileList);
        
        // Mostrar mensaje en consola
        console.log('🚀 Página de descargas lista - Método directo sin API');
    </script>
</body>
</html>
